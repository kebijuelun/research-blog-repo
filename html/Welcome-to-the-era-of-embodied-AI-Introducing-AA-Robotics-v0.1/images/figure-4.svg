<svg width="1000" height="430" aria-label="A task instruction goes to the model, which loops between the cameras and the arm until it stops, and a human judge then scores the end state" class="mx-auto h-auto w-full min-w-[720px]" role="img" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#0f1115"/><defs><pattern height="16" id="aarobotics-dots" patternUnits="userSpaceOnUse" width="16"><circle cx="1" cy="1" fill="hsl(#f2f3f5)" r="0.8"></circle></pattern><marker id="aarobotics-arrow-neutral" markerHeight="6" markerWidth="6" orient="auto" refX="6.5" refY="4" viewBox="0 0 8 8"><path d="M1.5 1.5 L6 4 L1.5 6.5" fill="none" stroke="hsl(#f2f3f5)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"></path></marker><marker id="aarobotics-arrow-purple" markerHeight="6" markerWidth="6" orient="auto" refX="6.5" refY="4" viewBox="0 0 8 8"><path d="M1.5 1.5 L6 4 L1.5 6.5" fill="none" stroke="hsl(#f2f3f5)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"></path></marker></defs><rect fill="url(#aarobotics-dots)" height="430" width="1000"></rect><text fill="hsl(#f2f3f5)" font-size="14" letter-spacing="0.4" text-anchor="middle" x="95" y="32">Task</text><text fill="hsl(#f2f3f5)" font-size="14" letter-spacing="0.4" text-anchor="middle" x="393" y="32">Attempt</text><text fill="hsl(#f2f3f5)" font-size="14" letter-spacing="0.4" text-anchor="middle" x="691" y="32">Attempt End</text><text fill="hsl(#f2f3f5)" font-size="14" letter-spacing="0.4" text-anchor="middle" x="905" y="32">Result Validated</text><g style="opacity:0;transition:opacity 0.6s ease"><rect fill="none" height="364" rx="12" stroke="hsl(#f2f3f5)" stroke-dasharray="5,4" stroke-width="1.2" width="328" x="229" y="50"></rect></g><g style="opacity:0;transition:opacity 0.6s ease" transform="translate(15, 166)"><rect fill="white" height="132" rx="10" stroke="hsl(#f2f3f5)" stroke-width="1.2" width="160"></rect><g transform="translate(12, 12)"><g fill="none" stroke="hsl(#f2f3f5)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"><path d="M3 1h13l6 6v15a1.2 1.2 0 0 1-1.2 1.2h-17.6A1.2 1.2 0 0 1 2 22V2.2A1.2 1.2 0 0 1 3 1z"></path><path d="M16 1v6h6"></path><line x1="6" x2="17" y1="13" y2="13"></line><line x1="6" x2="17" y1="16" y2="16"></line><line x1="6" x2="14" y1="19" y2="19"></line></g></g><text fill="hsl(#f2f3f5)" font-size="13" x="12" y="60">Plain-text instruction</text><rect fill="hsl(#f2f3f5)" height="52" rx="4" width="136" x="12" y="68"></rect><text fill="hsl(#f2f3f5)" font-size="12" x="20" y="83">Pour the drink</text><text fill="hsl(#f2f3f5)" font-size="12" x="20" y="98">from the bottle into</text><text fill="hsl(#f2f3f5)" font-size="12" x="20" y="113">the cup.</text></g><g style="opacity:0;transition:opacity 0.6s ease"><path d="M181 232 L222 232" fill="none" marker-end="url(#aarobotics-arrow-neutral)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4"></path><path d="M181 232 L222 232" fill="none" marker-end="url(#aarobotics-arrow-purple)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4" style="opacity:0;transition:opacity 0.4s ease"></path></g><g style="opacity:0;transition:opacity 0.6s ease"><rect fill="hsl(#f2f3f5)" height="64" rx="10" width="220" x="283" y="200"></rect><text fill="white" font-size="15" font-weight="600" text-anchor="middle" x="393" y="237">Language model</text></g><g style="opacity:0;transition:opacity 0.6s ease"><g><rect fill="white" height="64" rx="10" stroke="hsl(#f2f3f5)" stroke-width="1.2" style="transition:fill 0.4s ease, stroke 0.4s ease" width="150" x="318" y="66"></rect><text fill="hsl(#f2f3f5)" font-size="15" font-weight="600" text-anchor="middle" x="393" y="103">Cameras</text></g><g><rect fill="white" height="64" rx="10" stroke="hsl(#f2f3f5)" stroke-width="1.2" style="transition:fill 0.4s ease, stroke 0.4s ease" width="150" x="318" y="334"></rect><text fill="hsl(#f2f3f5)" font-size="15" font-weight="600" text-anchor="middle" x="393" y="371">Robot arm</text></g></g><g style="opacity:0;transition:opacity 0.6s ease"><path d="M378 198 L378 136" fill="none" marker-end="url(#aarobotics-arrow-neutral)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4"></path><path d="M378 198 L378 136" fill="none" marker-end="url(#aarobotics-arrow-purple)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4" style="opacity:0;transition:opacity 0.4s ease"></path></g><g style="opacity:0;transition:opacity 0.6s ease"><path d="M408 132 L408 194" fill="none" marker-end="url(#aarobotics-arrow-neutral)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4"></path><path d="M408 132 L408 194" fill="none" marker-end="url(#aarobotics-arrow-purple)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4" style="opacity:0;transition:opacity 0.4s ease"></path></g><g style="opacity:0;transition:opacity 0.6s ease"><path d="M378 266 L378 328" fill="none" marker-end="url(#aarobotics-arrow-neutral)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4"></path><path d="M378 266 L378 328" fill="none" marker-end="url(#aarobotics-arrow-purple)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4" style="opacity:0;transition:opacity 0.4s ease"></path></g><g style="opacity:0;transition:opacity 0.6s ease"><path d="M408 332 L408 270" fill="none" marker-end="url(#aarobotics-arrow-neutral)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4"></path><path d="M408 332 L408 270" fill="none" marker-end="url(#aarobotics-arrow-purple)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4" style="opacity:0;transition:opacity 0.4s ease"></path></g><g style="opacity:0;transition:opacity 0.6s ease"><path d="M563 232 L604 232" fill="none" marker-end="url(#aarobotics-arrow-neutral)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4"></path><path d="M563 232 L604 232" fill="none" marker-end="url(#aarobotics-arrow-purple)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4" style="opacity:0;transition:opacity 0.4s ease"></path></g><g style="opacity:0;transition:opacity 0.6s ease" transform="translate(611, 166)"><rect fill="white" height="132" rx="10" stroke="hsl(#f2f3f5)" stroke-width="1.2" width="160"></rect><g transform="translate(12, 12)"><g fill="none" stroke="hsl(#f2f3f5)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"><path d="M2 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="2" x2="2" y1="22" y2="15"></line></g></g><text fill="hsl(#f2f3f5)" font-size="13" x="12" y="60">The model ends</text><text fill="hsl(#f2f3f5)" font-size="13" x="12" y="79">the attempt when</text><text fill="hsl(#f2f3f5)" font-size="13" x="12" y="98">it judges the task</text><text fill="hsl(#f2f3f5)" font-size="13" x="12" y="117">complete, or gives up</text></g><g style="opacity:0;transition:opacity 0.6s ease"><path d="M777 232 L818 232" fill="none" marker-end="url(#aarobotics-arrow-neutral)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4"></path><path d="M777 232 L818 232" fill="none" marker-end="url(#aarobotics-arrow-purple)" stroke="hsl(#f2f3f5)" stroke-dasharray="3,4" stroke-width="1.4" style="opacity:0;transition:opacity 0.4s ease"></path></g><g style="opacity:0;transition:opacity 0.6s ease" transform="translate(825, 166)"><rect fill="white" height="132" rx="10" stroke="hsl(#f2f3f5)" stroke-width="1.2" width="160"></rect><g transform="translate(12, 12)"><g fill="none" stroke="hsl(#f2f3f5)" stroke-linecap="round" stroke-width="1.6"><circle cx="10" cy="10" r="8"></circle><line x1="16" x2="23" y1="16" y2="23"></line></g></g><text fill="hsl(#f2f3f5)" font-size="13" x="12" y="60">A human judge</text><text fill="hsl(#f2f3f5)" font-size="13" x="12" y="79">scores the end state</text></g></svg>