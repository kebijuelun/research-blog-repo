<svg xmlns="http://www.w3.org/2000/svg" aria-label="Illustrative stacked-area chart, not a measured time series. Partition capacity drops from 10K to 5K RU/s. Successful requests (200) fall from 6K to 5K RU/s, while throttled requests (429) rise from zero to 1K RU/s. Total demand stays at 6K RU/s. The key stays whole on one physical partition; the container still has 20K RU/s in total." class="fFUdLa_chart" role="img"><rect width="100%" height="100%" fill="#ffffff"/><g dominant-baseline="middle"><text class="fFUdLa_meta" text-anchor="middle" x="7%" y="27">RU/s</text><g><line class="fFUdLa_grid" x1="14%" x2="96%" y1="282" y2="282"/><text text-anchor="end" x="11%" y="282">0</text></g><g><line class="fFUdLa_grid" x1="14%" x2="96%" y1="172" y2="172"/><text text-anchor="end" x="11%" y="172">5K</text></g><g><text text-anchor="end" x="11%" y="150">6K</text></g><g><line class="fFUdLa_grid" x1="14%" x2="96%" y1="62" y2="62"/><text text-anchor="end" x="11%" y="62">10K</text></g><rect class="fFUdLa_success" height="132" width="41%" x="14%" y="150"/><rect class="fFUdLa_success" height="110" width="41%" x="55%" y="172"/><rect class="fFUdLa_throttled" height="22" width="41%" x="55%" y="150"/><g class="fFUdLa_blue" stroke-width="1.25"><line x1="14%" x2="55%" y1="150" y2="150"/><line x1="55%" x2="55%" y1="150" y2="172"/><line x1="55%" x2="96%" y1="172" y2="172"/></g><line class="fFUdLa_amber" x1="55%" x2="96%" y1="150" y2="150"/><g class="fFUdLa_axis" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="1"><line x1="14%" x2="55%" y1="62" y2="62"/><line x1="55%" x2="55%" y1="62" y2="172"/><line x1="55%" x2="96%" y1="172" y2="172"/></g><line class="fFUdLa_axis" x1="55%" x2="55%" y1="16" y2="282"/><g text-anchor="middle"><text x="34.5%" y="216">200</text><text x="75.5%" y="227">200</text><text x="75.5%" y="161">429</text></g></g></svg>