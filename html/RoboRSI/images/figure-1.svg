<svg width="640" height="570" aria-label="Pass 1 to Pass 5 radar showing relative progress in tokens, runtime, Skill Tree, and tool calls, plus cumulative LIBERO-PRO and LIBERO task pass rates" class="capability-radar-svg" data-label-en="Pass 1 to Pass 5 radar showing relative progress in tokens, runtime, Skill Tree, and tool calls, plus cumulative LIBERO-PRO and LIBERO task pass rates" data-label-zh="Pass 1 到 Pass 5 的 Token、时间、技能树与工具调用相对进展，以及 LIBERO-PRO 和 LIBERO 累计任务通过率雷达图" role="img" viewBox="0 0 640 570" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/>
