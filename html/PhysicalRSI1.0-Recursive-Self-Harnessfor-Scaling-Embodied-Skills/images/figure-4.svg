<svg width="520" height="575" aria-labelledby="ours-sketch-title ours-sketch-desc" role="img" viewBox="0 0 520 575" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/><title id="ours-sketch-title">System 2 directs and improves a System 1 execution harness</title><desc id="ours-sketch-desc">Planning: a multimodal foundation model understands the scene and makes decisions as System 2. The illustrative planning estimate is 0.1 to 1 Hz, not a measured deployment rate. It composes skills including VLAs and programs, together with tools, inside an editable System 1 control harness. Acting: the System 1 harness invokes the physical API and acts in the world. The illustrative action-control estimate is 20 to 50 Hz, distinct from model-inference and simulation rates. Observations return to System 2; Reflecting is a separate feedback-driven rewrite-and-test loop that revises the harness and control chain across iterations.</desc><defs><marker id="ours-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path d="M1 1 8 5 1 9" fill="none" stroke="#586664" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></marker><marker id="ours-rose" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path d="M1 1 8 5 1 9" fill="none" stroke="#3da396" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></marker></defs>
