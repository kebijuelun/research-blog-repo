<svg width="300" height="250" aria-labelledby="memory-state-title memory-state-desc" class="memory-state-diagram" role="img" viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#0f1115"/><title id="memory-state-title">State is created anew in each rollout</title><desc id="memory-state-desc">The code-policy skill saves an approach joint pose measured in the current rollout, then reads it after release and retreat. The stored pose is cleared for the next rollout.</desc><defs><marker id="memory-flow-tip" markerHeight="6" markerWidth="6" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path d="M1 1 8 5 1 9" fill="none" stroke="#53a298" stroke-width="1.5"></path></marker></defs>
